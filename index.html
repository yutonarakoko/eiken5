<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英検5級 英和辞典</title>
<style>
  :root{
    --paper:#F1F3EE; --card:#FFFFFF; --ink:#1B2420; --ink-soft:#5D6A62;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:16px; line-height:1.7;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    padding-top:calc(14px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
  }
  h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft)}
  .count{margin:0 0 10px;font-size:12px;color:var(--ink-soft)}
  .searchbox{position:relative}
  #q{
    width:100%;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:22px;padding:12px 42px 12px 14px;
    border:1.5px solid var(--ink);border-radius:2px;
    background:var(--card);color:var(--ink);
  }
  #q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  #clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:none;color:var(--ink-soft);font-size:20px;
    width:34px;height:34px;cursor:pointer;display:none;
  }
  nav{display:flex;gap:20px;margin:10px 0 0}
  nav button{
    border:0;background:none;padding:8px 0 10px;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;font-family:inherit;
  }
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .entry{
    background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--accent);border-radius:3px;
    padding:14px 16px;margin:14px 0;
  }
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.01em;
  }
  .pos{font-size:12px;color:var(--ink-soft)}
  .mean{font-size:19px;font-weight:600;margin:8px 0 0}
  .ex{margin:12px 0 0;padding:10px 12px;background:var(--paper);border-radius:2px;font-size:15px}
  .ex .en{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:16px}
  .ex .ja{color:var(--ink-soft);font-size:14px;margin-top:2px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{
    font-family:inherit;font-size:13px;font-weight:600;
    padding:7px 12px;border:1px solid var(--line);border-radius:2px;
    background:var(--card);color:var(--ink);cursor:pointer;
  }
  .acts button.on{background:var(--mark);border-color:var(--mark);color:#fff}
  .acts button:active{transform:scale(.97)}
  ul.hits{list-style:none;margin:8px 0 0;padding:0}
  ul.hits li{border-bottom:1px solid var(--line)}
  ul.hits button{
    width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:11px 2px;display:flex;align-items:baseline;gap:10px;font-family:inherit;
  }
  ul.hits .w{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:18px;color:var(--ink)}
  ul.hits .m{font-size:13px;color:var(--ink-soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .log{margin:10px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.9}
  .log b{font-weight:600;color:var(--ink)}
  .log .d{display:inline-block;padding:1px 7px;margin:0 3px 3px 0;border-radius:2px;
          background:var(--accent-bg);color:var(--accent);font-weight:600}
  .log.warm .d{background:#F6E7C8;color:var(--g4,#9A6410)}
  .log.hot .d{background:#F3D3D0;color:#9C2E24}
  .log.hot b{color:#9C2E24}
  .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-soft)}
  .cnt.hot{color:#9C2E24}
  .note{color:var(--ink-soft);font-size:14px;margin:18px 0}
  .askbtn{
    display:block;width:100%;margin:10px 0;
    font-family:inherit;font-size:15px;font-weight:600;padding:13px;
    border:1.5px solid var(--accent);border-radius:2px;
    background:var(--card);color:var(--accent);cursor:pointer;
  }
  .askbtn:disabled{opacity:.5}
  .secttl{font-size:13px;font-weight:600;color:var(--ink-soft);margin:22px 0 4px}
  .dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
  @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @media (prefers-reduced-motion:reduce){.dots::after{content:"...";animation:none}}
</style>
</head>

</header>

const DICT = RAW.trim().split("\n").map(l=>{
  const p = l.split("|");
  return {w:p[0], pos:p[1], ja:p[2], ex:p[3], exja:p[4], yomi:p[5]||""};
});
const INDEX = {}; DICT.forEach(e=>INDEX[e.w.toLowerCase()] = e);

/* 語尾の変化を元の形に戻す（plays → play, goes → go, studies → study） */
function baseForms(w){
  const t = w.toLowerCase(), out = [];
  const push = (base, label) => { if(base && base !== t) out.push([base, label]); };
  // 3人称単数の s / 名詞の複数形
  if(/ies$/.test(t))      push(t.slice(0,-3)+"y", "3人称単数・複数");
  if(/(ches|shes|sses|xes|zes|oes)$/.test(t)) push(t.slice(0,-2), "3人称単数・複数");
  if(/s$/.test(t) && !/ss$/.test(t)) push(t.slice(0,-1), "3人称単数・複数");
  // 過去形・過去分詞
  if(/ied$/.test(t))      push(t.slice(0,-3)+"y", "過去形");
  if(/ed$/.test(t))     { push(t.slice(0,-2), "過去形"); push(t.slice(0,-1), "過去形"); }
  // ing形
  if(/ing$/.test(t))    { push(t.slice(0,-3), "ing形"); push(t.slice(0,-3)+"e", "ing形"); }
  // 子音を重ねた形（stopped, running, bigger）
  const m = t.match(/^(.*?)([bdfglmnprt])\2(ed|ing|er|est)$/);
  if(m) push(m[1]+m[2], m[3]==="ing" ? "ing形" : m[3]==="ed" ? "過去形" : "比較の形");
  // 比較級・最上級
  if(/er$/.test(t))     { push(t.slice(0,-2), "比較級"); push(t.slice(0,-1), "比較級"); }
  if(/iest$/.test(t))     push(t.slice(0,-4)+"y", "最上級");
  if(/est$/.test(t))    { push(t.slice(0,-3), "最上級"); push(t.slice(0,-2), "最上級"); }
  return out;
}

function resolveForm(term){
  for(const [base, label] of baseForms(term)){
    const e = INDEX[base];
    if(e) return { entry: e, label, typed: term };
  }
  return null;
}

let logs = {};           // { word: ["2026-09-15", ...] }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  const [ , m, d ] = iso.split("-");
  return Number(m) + "/" + Number(d);
}
async function recordLook(w){
  const key = w.toLowerCase(), t = todayStr();
  const arr = logs[key] || (logs[key] = []);
  if(arr[arr.length-1] === t) return;   // 同じ日は1回だけ
  arr.push(t);
  await storeLog.set(logs);
}
function logHTML(w){
  const arr = logs[w.toLowerCase()] || [];
  if(!arr.length) return "";
  const cls = arr.length >= 5 ? "hot" : arr.length >= 3 ? "warm" : "";
  return `<p class="log ${cls}">しらべた日　${arr.map(d=>`<span class="d">${fmtDate(d)}</span>`).join("")}<b>${arr.length}回</b></p>`;
}

const isMarked = w => marks.some(m=>m.w.toLowerCase()===w.toLowerCase());
async function toggleMark(entry){
  if(isMarked(entry.w)) marks = marks.filter(m=>m.w.toLowerCase()!==entry.w.toLowerCase());
  else marks = [entry, ...marks];
  await store.set(marks);
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.85;
  speechSynthesis.speak(u);
}

/* ひらがな⇄カタカナを同一視して照合する */
function kanaNorm(s){
  return String(s)
    .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[ー－]/g, "")
    .toLowerCase();
}
DICT.forEach(e => e.k = kanaNorm(e.ja + " " + e.yomi));

function search(term){
  const t = term.trim().toLowerCase();
  if(!t) return [];
  const starts = DICT.filter(e=>e.w.toLowerCase().startsWith(t));
  const kt = kanaNorm(term.trim());
  const inside = DICT.filter(e=>!e.w.toLowerCase().startsWith(t) &&
    (e.w.toLowerCase().includes(t) || e.ja.includes(term.trim()) || (kt && e.k.includes(kt))));
  return [...starts, ...inside].slice(0, 40);
}

function render(){
  if(tab === "mark"){
    let h = marks.length
      ? marks.map(entryHTML).join("")
      : `<p class="note">まだ何も保存していません。単語を引いて「☆ ブックマーク」を押すと、ここにたまります。</p>`;
    if(misses.length){
      h += `<div class="secttl">辞書になかった単語</div>
        <ul class="hits">${misses.map(m=>`<li><button data-del="${esc(m)}">
          <span class="w">${esc(m)}</span><span class="m">タップで消す</span></button></li>`).join("")}</ul>`;
    }
    main.innerHTML = h;
    return;
  }
  if(tab === "log"){
    const rows = Object.entries(logs)
      .map(([w,a])=>({w, n:a.length, last:a[a.length-1], e:INDEX[w]}))
      .filter(r=>r.e).sort((a,b)=> b.n - a.n || (a.last < b.last ? 1 : -1));
    main.innerHTML = rows.length
      ? `<p class="note">引いた回数が多い順です。回数が多いほど、まだ覚えきれていない単語です。</p>
         <ul class="hits">${rows.map(r=>`<li><button data-open="${esc(r.e.w)}">
           <span class="w">${esc(r.e.w)}</span><span class="m">${esc(r.e.ja)}</span>
           <span class="cnt ${r.n>=5?"hot":""}">${r.n}回</span></button></li>`).join("")}</ul>`
      : `<p class="note">まだ記録がありません。単語を引くと、引いた日がここにたまっていきます。</p>`;
    return;
  }
  if(tab === "all"){
    const sorted = [...DICT].sort((a,b)=>a.w.toLowerCase().localeCompare(b.w.toLowerCase()));
    main.innerHTML = hitsHTML(sorted);
    return;
  }
  const term = q.value.trim();
  if(!term){
    main.innerHTML = current ? entryHTML(current)
      : `<p class="note">英単語でも日本語でも引けます。辞書になかった単語はメモしておけば、あとでまとめて追加できます。</p>`;
    return;
  }
  const hits = search(term);
  const exact = INDEX[term.toLowerCase()];
  const form = exact ? null : resolveForm(term);
  let html = "";
  if(exact) html += entryHTML(exact);
  else if(form){
    html += `<p class="note"><b>${esc(form.typed)}</b> は <b>${esc(form.entry.w)}</b> の${esc(form.label)}です。</p>`
          + entryHTML(form.entry);
  }
  const shown = exact || (form && form.entry);
  const rest = hits.filter(e=>!shown || e.w !== shown.w);
  if(rest.length) html += (shown ? `<div class="secttl">ほかの候補</div>` : "") + hitsHTML(rest);
  if(!shown){
    html += `<p class="note">「${esc(term)}」はこの辞書にありません。</p>
      <button class="askbtn" id="ask">この単語をメモしておく</button>`;
  }
  main.innerHTML = html;
}

async function recordMiss(term){
  if(!term) return;
  if(!misses.includes(term)) misses = [term, ...misses];
  await storeMiss.set(misses);
  const btn = document.getElementById("ask");
  if(btn){ btn.disabled = true; btn.textContent = "メモしました"; }
}

/* イベント */
q.addEventListener("input", ()=>{
  clearBtn.style.display = q.value ? "block" : "none";
  if(tab !== "search"){ setTab("search"); return; }
  current = null; render();
});
q.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    e.preventDefault(); q.blur();
    const term = q.value.trim();
    render();
  }
});
clearBtn.addEventListener("click", ()=>{ q.value=""; clearBtn.style.display="none"; current=null; render(); q.focus(); });

main.addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id === "ask"){ await recordMiss(q.value.trim()); return; }
  if(b.dataset.del){
    misses = misses.filter(m=>m !== b.dataset.del);
    await storeMiss.set(misses); render(); return;
  }
  if(b.dataset.speak){ speak(b.dataset.speak); return; }
  if(b.dataset.open){ current = INDEX[b.dataset.open.toLowerCase()]; q.value = b.dataset.open; clearBtn.style.display="block"; setTab("search"); return; }
  if(b.dataset.mark){
    const w = b.dataset.mark;
    const entry = INDEX[w.toLowerCase()] || (current && current.w === w ? current : marks.find(m=>m.w===w));
    if(entry){ await toggleMark(entry); render(); }
  }
});

function setTab(t){
  tab = t;
  document.getElementById("tab-search").setAttribute("aria-selected", t==="search");
  document.getElementById("tab-mark").setAttribute("aria-selected", t==="mark");
  document.getElementById("tab-log").setAttribute("aria-selected", t==="log");
  document.getElementById("tab-all").setAttribute("aria-selected", t==="all");
  render();
}
document.getElementById("tab-search").onclick = ()=>setTab("search");
document.getElementById("tab-mark").onclick   = ()=>setTab("mark");
document.getElementById("tab-log").onclick    = ()=>setTab("log");
document.getElementById("tab-all").onclick    = ()=>setTab("all");

(async ()=>{ marks = await store.get(); misses = await storeMiss.get(); logs = await storeLog.get(); render(); })();
</script>
</body>
</html>
